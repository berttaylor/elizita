<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elizita</title>
<style>
  :root { --bg: #0b0f0b; --fg: #7dff8a; --dim: #3f8f48; --faint: #1c2a1d; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 1rem; height: 100vh; max-width: 56rem; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 0.95rem/1.5 "Courier New", ui-monospace, monospace;
  }
  header { color: var(--dim); margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  h1, h2, h3 { font-size: inherit; margin: 0; }
  h1 { font-weight: normal; }
  a { color: inherit; }
  select, input, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--dim); padding: .3rem .5rem; }
  button { cursor: pointer; }
  select:focus, input:focus, button:focus, summary:focus { outline: 2px solid var(--fg); }
  label { display: inline-flex; gap: .3rem; align-items: center; cursor: pointer; }
  label input { accent-color: var(--fg); }

  #log { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; }
  #log p { margin: 0 0 .75rem; }
  #log .you { color: var(--dim); }
  #log .you::before { content: "> "; }
  #log .why { margin-top: -.6rem; padding-left: 1.2rem; color: var(--dim); font-size: .8em; }
  #log .why span + span::before { content: "  →  "; }
  body.hide-why #log .why { display: none; }
  form { display: flex; gap: .5rem; border-top: 1px solid var(--dim); padding-top: .75rem; }
  form input { flex: 1; min-width: 0; }

  /* "About this system" pop-out: covers the chat; full screen on phones. */
  dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--dim); padding: 0;
           width: min(56rem, 100vw - 2rem); max-height: calc(100vh - 2rem); }
  dialog::backdrop { background: rgb(0 0 0 / .7); }
  dialog .bar { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between;
                align-items: center; padding: .75rem 1rem; border-bottom: 1px solid var(--faint); }
  dialog .body { padding: 1rem; }
  @media (max-width: 760px) { dialog { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; margin: 0; } }
  dialog section { margin-bottom: 1.5rem; }
  dialog h3 { color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
  dialog p { margin: 0 0 .6rem; }
  .muted { color: var(--dim); }
  .small { font-size: .85em; }
  details { border-left: 2px solid var(--faint); padding-left: .5rem; margin-bottom: .3rem; }
  summary { cursor: pointer; }
  .rule { margin: .3rem 0 .6rem; }
  .rule ul { margin: .1rem 0; padding-left: 1.4rem; color: var(--dim); }
  #search { width: 100%; margin-bottom: .5rem; }
</style>
</head>
<body>
<header>
  <h1>ELIZA and descendants ·</h1>
  <select id="set" aria-label="Rule set"></select>
  <button id="open-about" type="button">About this system</button>
  <label><input type="checkbox" id="show-why" checked> show workings</label>
</header>
<div id="log" aria-live="polite"></div>
<form id="form">
  <input id="msg" aria-label="Message" autocomplete="off" autofocus placeholder="Type, then Enter. Say bye to stop.">
  <button>Send</button>
</form>
<dialog id="about" aria-labelledby="name">
  <div class="bar"><h2 id="name"></h2><button id="close-about" type="button">Close ✕</button></div>
  <div class="body">
    <section><p class="muted small" id="source"></p><a id="rules-link" class="small">raw rules file</a></section>
    <section><h3>How it works</h3><div id="about-text"></div></section>
    <section><h3>The rules</h3><div id="rules"></div></section>
  </div>
</dialog>
<script type="module">
  import { createEliza, loadRules } from "./eliza.js";

  // The sentence model for tiers that match by meaning or track mood. Same model and settings
  // as tools/model.mjs, so the browser's vectors match the precomputed ones.
  const TRANSFORMERS = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";
  const MODEL = "Xenova/all-MiniLM-L6-v2";

  const $ = id => document.getElementById(id);
  const getJSON = async url => (await fetch(url)).json();
  const getBytes = async url => (await fetch(url)).arrayBuffer();
  // el("p", { className: "muted" }, "text", childElement, ...)
  function el(tag, props, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter(c => c != null));
    return node;
  }

  // Pick a rule set from rules/index.json (?rules=<id>, default: the first one).
  const sets = await getJSON("rules/index.json");
  const current = sets.find(s => s.id === new URLSearchParams(location.search).get("rules")) || sets[0];
  const select = $("set");
  for (const s of sets) select.add(new Option(s.name, s.id, false, s === current));
  select.addEventListener("change", () => { location.search = "?rules=" + select.value; });
  $("rules-link").href = `rules/${current.id}.json`;

  const rules = await loadRules(current.id, getJSON, getBytes);

  // ---- "About this system" pop-out: what this system is and what its rules are ----
  const about = $("about");
  $("open-about").addEventListener("click", () => about.showModal());
  $("close-about").addEventListener("click", () => about.close());
  $("name").textContent = rules.name;
  $("source").textContent = rules.source || "";
  $("about-text").append(...(rules.about || []).map(text => el("p", {}, text)));
  const parts = [...rules.includes.map(id => `builds on ${sets.find(s => s.id === id)?.name || id}`),
                 rules.fallback ? `falls back to ${rules.fallback.name}` : null].filter(Boolean);
  if (parts.length) $("about-text").append(el("p", { className: "muted" }, `This rule set ${parts.join(" and ")}.`));

  // A template node from the AIML "categories" format, flattened for display.
  function flatten(node) {
    if (typeof node === "string") return node;
    if (Array.isArray(node)) return node.map(flatten).join("");
    const [tag] = Object.keys(node), value = node[tag];
    if (tag === "set") return `[${node.set} = ${flatten(node.to)}]`;
    if (tag === "random") return `[one of: ${value.map(flatten).join(" | ")}]`;
    if (tag === "condition") return `[${value.map(c => {
      const name = typeof c.name === "string" ? c.name : flatten(c.name || "");
      const test = c.above !== undefined ? `${name} > ${c.above}` : c.below !== undefined ? `${name} < ${c.below}`
        : c.value !== undefined ? `${name} = ${c.value}` : null;
      return `${test ? `if ${test}` : "otherwise"}: ${flatten(c.then)}`;
    }).join("; ")}]`;
    if (typeof value === "string") return `[${tag} ${value}]`;
    if (typeof value === "number") return value === 1 ? `[${tag}]` : `[${tag} ${value}]`;
    return `[${tag} ${flatten(value)}]`;
  }
  const show = reasmb => (typeof reasmb === "string" ? reasmb : `rewrite to "${reasmb.pre}", goto ${reasmb.goto}`);
  const box = $("rules");

  if (rules.keywords && !rules.categories) {
    // Aliases (a keyword with no patterns of its own, e.g. MACHINE -> COMPUTER) are folded into their target.
    const keys = Object.entries(rules.keywords);
    const aliases = {};
    for (const [word, entry] of keys) if (!entry.rules && entry.goto) (aliases[entry.goto] ||= []).push(word);
    const main = keys.filter(([, entry]) => entry.rules).sort((a, b) => (b[1].rank || 0) - (a[1].rank || 0));

    // "* YOUR * (/FAMILY) *" -> pieces ["[anything]", "YOUR", "[anything]", "[a family word]", "[anything]"]
    const pieceName = token =>
      token === "*" ? "[anything]" :
      /^\d+$/.test(token) ? `[exactly ${token} word${token === "1" ? "" : "s"}]` :
      token.startsWith("(/") ? `[a ${token.slice(2, -1).trim().toLowerCase()} word]` :
      token.startsWith("(*") ? `[${token.slice(2, -1).trim().split(/\s+/).join(" or ")}]` : token;
    const describe = reply =>
      typeof reply === "object" ? `rewrite your sentence as "${reply.pre}", then use ${reply.goto}'s patterns` :
      reply === "newkey" ? "(give up on this keyword and try the next one in your sentence)" :
      reply.startsWith("goto ") ? `(use ${reply.slice(5)}'s patterns instead)` : reply;

    box.append(
      el("p", {}, "ELIZA looks for these keywords in what you type. If your sentence has several, the one with the highest priority wins."),
      el("p", {}, "Open a keyword to see its patterns. The first pattern your sentence fits decides the replies, which are used in turn, one per visit. A number like (4) in a reply repeats piece 4 of your sentence: each part of the pattern is one numbered piece."),
      rules.substitute?.I === "YOU" ? el("p", {}, "One 1966 quirk: I/YOU and MY/YOUR are swapped before matching, so the patterns are written back-to-front. YOU in a pattern means you typed I, and YOUR means you typed MY.") : null);
    for (const [word, entry] of main) {
      const also = aliases[word] ? `  ·  also ${aliases[word].join(", ")}` : "";
      box.append(el("details", {},
        el("summary", {}, `${word}${entry.rank ? `  ·  priority ${entry.rank}` : ""}${also}`),
        ...entry.rules.map(rule => {
          const pieces = rule.decomp.match(/\([^)]*\)|\S+/g).map(pieceName);
          const numbered = rule.reasmb.some(r => typeof r === "string" && /\(\d+\)/.test(r));
          return el("div", { className: "rule" },
            el("div", {}, `If your sentence looks like:  ${pieces.join("  ")}`),
            numbered ? el("div", { className: "muted small" }, "pieces: " + pieces.map((p, i) => `(${i + 1}) ${p}`).join("   ")) : null,
            el("div", { className: "muted small" }, rule.reasmb.length > 1 ? "ELIZA replies, in turn:" : "ELIZA replies:"),
            el("ul", {}, ...rule.reasmb.map(r => el("li", {}, describe(r)))));
        }),
        entry.goto ? el("p", { className: "muted small" }, `If none of these patterns fit: use ${entry.goto}'s patterns.`) : null));
    }
    const pairs = obj => Object.entries(obj || {}).map(([k, v]) => `${k} → ${Array.isArray(v) ? v.join(" ") : v}`).join(",  ");
    if (rules.substitute) box.append(el("details", {}, el("summary", {}, "words swapped as your sentence is read (I → YOU, MY → YOUR)"), el("p", {}, pairs(rules.substitute))));
    if (rules.reflect) box.append(el("details", {}, el("summary", {}, "words swapped in the reply (MY → YOUR)"), el("p", {}, pairs(rules.reflect))));
    if (rules.tags) box.append(el("details", {}, el("summary", {}, "word groups, e.g. \"a family word\""), el("p", {}, pairs(rules.tags))));
    if (rules.memory) box.append(el("details", {}, el("summary", {}, `memory: remarks saved when you say ${rules.memory.keyword}, brought back later`),
      el("ul", {}, ...rules.memory.rules.map(r => el("li", {}, `${r.decomp}  →  ${r.reasmb}`)))));
    if (rules.none) box.append(el("details", {}, el("summary", {}, "when no keyword is found"), el("ul", {}, ...rules.none.map(r => el("li", {}, r)))));
  }

  if (rules.categories) {
    const search = el("input", { id: "search", type: "search", placeholder: "search patterns, e.g. NAME or LIKE", ariaLabel: "Search patterns" });
    const results = el("div");
    box.append(el("p", { className: "muted" }, `${rules.categories.length.toLocaleString()} categories. Each is a pattern for the whole sentence, an optional "after" (what the bot said last) and a reply.`), search, results);
    function list() {
      const q = search.value.trim().toUpperCase();
      const hits = rules.categories.filter(c => !q || c.pattern.includes(q)).slice(0, 50);
      results.replaceChildren(...hits.map(c => el("div", { className: "rule" },
        el("div", {}, c.pattern + (c.that ? `   (after "${c.that}")` : "")),
        el("ul", {}, el("li", {}, flatten(c.template).trim())))));
      if (!hits.length) results.append(el("p", { className: "muted" }, "No pattern contains that."));
    }
    search.addEventListener("input", list);
    list();
  }

  // ---- The chat. Each reply carries its workings (eliza.trace) underneath. ----
  const log = $("log");
  const input = $("msg");
  function say(text, who, why) {
    log.append(el("p", { className: who }, text));
    if (why?.length) log.append(el("p", { className: "why" }, "↳ ", ...why.map(step => el("span", {}, step.trim()))));
    log.scrollTop = log.scrollHeight;
  }

  // "show workings" toggle, remembered per browser.
  const showWhy = $("show-why");
  try { showWhy.checked = localStorage.getItem("elizita.showWhy") !== "no"; } catch {}
  const applyWhy = () => {
    document.body.classList.toggle("hide-why", !showWhy.checked);
    try { localStorage.setItem("elizita.showWhy", showWhy.checked ? "yes" : "no"); } catch {}
  };
  showWhy.addEventListener("change", applyWhy);
  applyWhy();

  // Load the sentence model if this rule set needs it (about 23MB, cached by the browser after).
  let embed = null;
  const needsModel = r => r && (r.meaning || r.moods || needsModel(r.fallback));
  if (needsModel(rules)) {
    input.disabled = true;
    const status = el("p", { className: "why" }, "loading the sentence model (about 23MB, only the first time)…");
    log.append(status);
    const { pipeline } = await import(TRANSFORMERS);
    const extractor = await pipeline("feature-extraction", MODEL, {
      dtype: "q8",
      progress_callback: p => { if (p.status === "progress" && p.file?.endsWith(".onnx")) status.textContent = `loading the sentence model… ${Math.round(p.progress)}%`; },
    });
    embed = async text => (await extractor(text, { pooling: "mean", normalize: true })).data;
    status.textContent = "sentence model ready";
    input.disabled = false;
    input.focus();
  }
  const eliza = createEliza(rules, { embed });

  // Mood meters in the About dialog (tier 5).
  const moodBox = el("section", {}, el("h3", {}, "Mood"), el("pre", { id: "meters" }));
  if (rules.moods) $("about-text").parentElement.after(moodBox);
  const showMoods = () => { if (rules.moods) $("meters").textContent = eliza.moods().map(m => m.meter).join("\n"); };
  showMoods();

  say(eliza.initial, "eliza");
  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || input.disabled) return;
    input.value = "";
    say(text, "you");
    if (eliza.isQuit(text)) {
      say(eliza.final, "eliza");
      input.disabled = true;
      return;
    }
    input.disabled = true;
    const reply = await eliza.reply(text);
    say(reply, "eliza", [...eliza.trace]);
    showMoods();
    input.disabled = eliza.ended; // PARRY can walk out
    if (!input.disabled) input.focus();
  });
</script>
</body>
</html>
